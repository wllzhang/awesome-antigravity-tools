name: Weekly Antigravity Candidate Discovery Radar

on:
  schedule:
    # Run weekly on Mondays at 03:00 UTC (11:00 AM Beijing time / CST)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      min_stars:
        description: 'Minimum GitHub stars'
        required: false
        default: '10'
        type: string
      min_score:
        description: 'Minimum Antigravity signal score (0-100)'
        required: false
        default: '55'
        type: string
      limit:
        description: 'Maximum candidates per report (1-100)'
        required: false
        default: '25'
        type: string

permissions:
  contents: read

concurrency:
  group: discovery-radar
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate Catalog and Exclusions Ledger
        run: |
          python scripts/aat_cli.py verify --check-sync --strict-warnings

      - name: Run Read-Only Candidate Discovery Radar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_STARS: ${{ inputs.min_stars || '10' }}
          MIN_SCORE: ${{ inputs.min_score || '55' }}
          LIMIT: ${{ inputs.limit || '25' }}
        run: |
          if [[ ! "$MIN_STARS" =~ ^[0-9]+$ ]]; then
            echo "[ERROR] Invalid min_stars: $MIN_STARS" >&2
            exit 1
          fi
          if [[ ! "$MIN_SCORE" =~ ^[0-9]+$ ]] || (( MIN_SCORE > 100 )); then
            echo "[ERROR] Invalid min_score (0-100): $MIN_SCORE" >&2
            exit 1
          fi
          if [[ ! "$LIMIT" =~ ^[0-9]+$ ]] || (( LIMIT < 1 || LIMIT > 100 )); then
            echo "[ERROR] Invalid limit (1-100): $LIMIT" >&2
            exit 1
          fi
          mkdir -p radar_out
          python scripts/discover_candidates.py \
            --min-stars "$MIN_STARS" \
            --min-score "$MIN_SCORE" \
            --limit "$LIMIT" \
            --sort score \
            --format md \
            --out radar_out/discovery_radar.md \
            --out-aat-cmd radar_out/discovery_commands.sh
          {
            echo "## Weekly Antigravity Discovery Radar"
            echo ""
            cat radar_out/discovery_radar.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Discovery Radar Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-radar-report
          path: |
            radar_out/discovery_radar.md
            radar_out/discovery_commands.sh
          retention-days: 14
          if-no-files-found: warn
