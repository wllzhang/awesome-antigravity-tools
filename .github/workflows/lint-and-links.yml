name: Lint, Tests & Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 08:00 UTC to detect stale/dead links
    - cron: '0 8 * * 1'

jobs:
  catalog-and-tests:
    name: Catalog Validation & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate Catalog Schema & Full Artifact Sync
        run: python scripts/aat_cli.py verify --check-sync --strict-warnings

      - name: Run Python Unit & Integration Tests
        run: python -m unittest discover -s tests -v

      - name: Check JS Syntax & Run Frontend Tests
        run: |
          node --check docs/catalog-logic.js
          node --check docs/insights.js
          node --check docs/app.js
          node --test tests/test_web.mjs

  link-check:
    name: External Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Link Checker with Lychee
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress './*.md'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            *.md
