name: Deploy Web Explorer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Site Bundle
        run: python scripts/build_site.py --check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: 'true'

      - name: Wait for Artifact Index Consistency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo "0")
            if [ "$COUNT" -ge 1 ]; then
              echo "[+] Verified github-pages artifact is indexed (attempt $i)."
              exit 0
            fi
            echo "[*] Waiting for github-pages artifact metadata propagation (attempt $i)..."
            sleep 2
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
