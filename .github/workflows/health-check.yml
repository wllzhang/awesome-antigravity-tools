name: Daily Repository Health Check & Prune Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/health-check.yml'
  schedule:
    # Run daily at 02:00 UTC (10:00 AM Beijing time / CST)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit_changes.outputs.updated }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Run Repository Health & Deprecation Audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/health-check.py --output-issue issue_body.md

      - name: Regenerate Badges, Bilingual Docs, Exports & Web Bundle
        run: |
          python scripts/aat_cli.py sync
          python scripts/aat_cli.py verify --check-sync --strict-warnings

      - name: Manage Health Audit Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f issue_body.md ]; then
            echo "[!] Health check detected repositories requiring attention."
            EXISTING_ISSUE=$(gh issue list --state open --label "health-audit" --json number --jq '.[0].number')
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "[*] Updating existing issue #$EXISTING_ISSUE..."
              gh issue comment "$EXISTING_ISSUE" --body-file issue_body.md
            else
              echo "[*] Creating new health audit issue..."
              gh issue create --title "🧹 Daily Health Audit: Deprecated or Inaccessible Repositories Detected" \
                --body-file issue_body.md \
                --label "health-audit"
            fi
          else
            echo "[+] All curated repositories are healthy. No action required."
            EXISTING_ISSUE=$(gh issue list --state open --label "health-audit" --json number --jq '.[0].number')
            if [ -n "$EXISTING_ISSUE" ]; then
              echo "[*] Closing resolved health audit issue #$EXISTING_ISSUE..."
              gh issue close "$EXISTING_ISSUE" --comment "All audited repositories are now healthy and verified! 🎉"
            fi
          fi

      - name: Commit Updated Audit Telemetry & Generated Docs
        id: commit_changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add health_report.md health_report.zh-CN.md README.md README.zh-CN.md COMPARISON.md \
            data/health_snapshot.json data/health_history.json data/badges/ data/exports/ \
            docs/catalog-bundle.json docs/feed.xml docs/sitemap.xml docs/robots.txt docs/llms.txt docs/logo.svg
          if git diff --staged --quiet; then
            echo "No changes in health audit artifacts."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(audit): refresh daily telemetry, badges, docs, and web bundle [skip ci]"
            pushed=false
            for attempt in 1 2 3 4; do
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "[!] git push attempt $attempt failed; retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
              git fetch origin main
              git rebase origin/main
            done
            if [ "$pushed" != "true" ]; then
              echo "[ERROR] Failed to push health audit commit after 4 attempts."
              exit 1
            fi
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

  deploy-pages:
    needs: health-check
    if: needs.health-check.outputs.updated == 'true'
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Updated Main Branch
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: 'true'

      - name: Wait for Artifact Index Consistency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in 1 2 3 4 5 6; do
            COUNT=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo "0")
            if [ "$COUNT" -ge 1 ]; then
              echo "[+] Verified github-pages artifact is indexed (attempt $i)."
              exit 0
            fi
            echo "[*] Waiting for github-pages artifact metadata propagation (attempt $i)..."
            sleep 2
          done

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
